name: Deploy Pages
on:                      # "Ejecutar este workflow cuando…"
  release:               # …pase algo con un Release
    types: [published]   # …específicamente, cuando se PUBLICA un Release
  workflow_dispatch:     # …o cuando lo ejecute yo a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
